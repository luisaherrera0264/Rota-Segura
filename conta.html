<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota Segura | Minha Conta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="conta.css">
</head>
<body>

<div class="conta-container">

    <header class="top-bar">
        <a href="responsavel.html" class="back-btn" aria-label="Voltar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </a>
        <span class="top-bar-title">Área do Responsável</span>
        <span class="spacer" aria-hidden="true"></span>
    </header>

    <!-- Cartão de perfil -->
    <div class="perfil-card">
        <span class="avatar">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
            </svg>
        </span>
        <div class="perfil-info">
            <strong id="perfilNome">Nome</strong>
            <span id="perfilEmail">Email</span>
        </div>
        <a href="perfil.html" class="btn-editar">Editar Perfil</a>
    </div>

    <!-- Menu de opções -->
    <nav class="opcoes-card">
        <a href="#" class="opcao">
            <span class="opcao-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6.5H4c.5-1 2-2.5 2-6.5Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
            </span>
            <span class="opcao-label">Notificações</span>
            <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>
        <a href="#" class="opcao">
            <span class="opcao-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M4 12h16M4 17h10"/><circle cx="17" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
            </span>
            <span class="opcao-label">Configurações</span>
            <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>
        <a href="#" class="opcao">
            <span class="opcao-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 16 0v4"/><rect x="2" y="14" width="4" height="5" rx="1"/><rect x="18" y="14" width="4" height="5" rx="1"/></svg>
            </span>
            <span class="opcao-label">Ajuda e Suporte</span>
            <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>
        <a href="#" class="opcao">
            <span class="opcao-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
            </span>
            <span class="opcao-label">Termos de Uso</span>
            <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>
        <a href="#" class="opcao">
            <span class="opcao-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5.5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10v-6L12 2z"/></svg>
            </span>
            <span class="opcao-label">Política de Privacidade</span>
            <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>

        <button onclick="sair()" class="btn-sair-conta">Sair da conta</button>
    </nav>

</div>

<script>
    // Preenche o cartão com o último usuário cadastrado (modo demo, via localStorage)
    (function() {
        let usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
        if (usuarios.length > 0) {
            let atual = usuarios[usuarios.length - 1];
            document.getElementById('perfilNome').textContent = atual.nome || 'Nome';
            document.getElementById('perfilEmail').textContent = atual.email || 'Email';
        }
    })();

    function sair() {
        if (confirm('Sair do sistema?')) {
            window.location.href = 'login.html';
        }
    }
</script>

</body>
</html>
