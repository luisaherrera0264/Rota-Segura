<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota Segura | Recuperar Senha</title>
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="login.css">
<style>
    /* Estilo padronizado para combinar perfeitamente com os inputs e botões do site */
    .styled-select {
        width: 100%;
        padding: 12px 16px;
        margin-bottom: 16px;
        border-radius: 12px;
        border: 1px solid #dcdcdc;
        background-color: #f9f9f9;
        font-family: 'Poppins', sans-serif;
        font-size: 14px;
        color: #333;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 16px center;
        background-size: 16px;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .styled-select:focus {
        outline: none;
        border-color: #4A90E2;
        background-color: #fff;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
    }
</style>
</head>
<body>

<div class="login-container">

    <header class="top-bar">
        <a href="login.html" class="back-btn" aria-label="Voltar para o login">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </a>
        <span class="top-bar-title">Rota Segura</span>
    </header>

    <div class="logo">
        <h1>Recuperar Senha</h1>
    </div>

    <form action="processaresquecisenha.php" method="POST">
        
        <div class="field">
            <select name="tipo" class="styled-select" required>
                <option value="" disabled selected>Selecione o Perfil</option>
                <option value="responsavel">Responsável</option>
                <option value="monitor">Monitor</option>
                <option value="motorista">Motorista</option>
            </select>
        </div>

        <div class="field">
            <input type="email" name="email" placeholder="E-mail cadastrado" autocomplete="email" required class="styled-input">
        </div>

        <div class="field">
            <input type="password" name="nova_senha" placeholder="Nova Senha" autocomplete="new-password" required class="styled-input">
        </div>

        <button type="submit">Atualizar Senha</button>
    </form>

</div>

</body>
</html>
